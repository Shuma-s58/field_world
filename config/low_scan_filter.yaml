# /low_surestar_scan から、ロボット自身の車体(ボディ・車輪・キャスター)に当たった点を除く。
# 実機側 (orne_box_bringup の pointcloud_to_laserscan.launch.py) が読む box_filter_box3.yaml に
# 相当するもの(humble/white_line_check ブランチには入っていなかったため新規作成)。
# base_link 基準の箱の内側にある点を削除する。フットプリント x:-0.3〜0.6, y:±0.3 に少し余裕を足した値。
scan_to_scan_filter_chain:
  ros__parameters:
    use_sim_time: true
    filter1:
      name: box_filter
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.35
        max_x: 0.65
        min_y: -0.35
        max_y: 0.35
        min_z: -1.0
        max_z: 2.0
